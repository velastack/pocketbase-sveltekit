name: Sync upstream

# Follows pocketbase/js-sdk releases. Upstream left GitHub and now lives at
# https://ganigeorgiev.com/git/pocketbase/js-sdk; the GitHub repo is frozen at
# v0.28.1. Every run rebases the sveltekit branch
# onto upstream's latest release tag with scripts/rebase-upstream.sh (which
# also picks the version, see the script). If that version has no vX.Y.Z tag on
# this repo yet, the tests run, then the branch is force-pushed and the tag is
# pushed. The tag push starts publish.yml, which publishes to npm. Publishing
# stays in publish.yml because npm trusted publishing is configured for that
# filename.
#
# Pushes use the PUSH_DEPLOY_KEY secret (a deploy key with write access), not
# GITHUB_TOKEN: GitHub refuses rebased commits that touch .github/workflows/
# from GITHUB_TOKEN, and tags pushed with GITHUB_TOKEN don't start publish.yml.
#
# A rebase conflict or failing test pushes nothing and fails the run, and so
# does a tagged version that publish.yml hasn't put on npm within two hours.
# GitHub emails failed scheduled runs to whoever last edited the cron line.
# (Issues are disabled on this repo, so there's no issue to open.)
#
# Fork-only release: commit the change to sveltekit (no version bump, notes in
# CHANGELOG-sveltekit.md), then run this workflow by hand with "bump" checked.

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: "Release the fork's own changes as the next patch version"
        type: boolean
        default: false
      dry_run:
        description: "Rebase and test only, push nothing"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # keep the schedule enabled

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # GitHub disables schedules in public repos after 60 days without
      # activity, and upstream can go that long between releases.
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync-upstream.yml/enable"

      - uses: actions/checkout@v6
        with:
          ref: sveltekit
          fetch-depth: 0
          ssh-key: ${{ secrets.PUSH_DEPLOY_KEY }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Rebase onto the latest upstream release
        id: rebase
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://ganigeorgiev.com/git/pocketbase/js-sdk
          git fetch --quiet --no-tags upstream
          git branch master upstream/master

          old_sha="$(git rev-parse HEAD)"
          args=()
          [ "$BUMP" = true ] && args+=(--bump)
          bash scripts/rebase-upstream.sh "${args[@]}"

          version="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged, nothing to release"
            needed=false
          else
            echo "v$version is new, releasing"
            needed=true
          fi
          {
            echo "old_sha=$old_sha"
            echo "version=$version"
            echo "needed=$needed"
          } >> "$GITHUB_OUTPUT"

      # publish.yml runs from the deploy key's tag push, so nobody is emailed
      # when it fails; this run fails instead
      - name: Check the latest release reached npm
        if: steps.rebase.outputs.needed == 'false'
        env:
          VERSION: ${{ steps.rebase.outputs.version }}
        run: |
          if [ -n "$(npm view "pocketbase-sveltekit@$VERSION" version 2>/dev/null)" ]; then
            echo "$VERSION is on npm"
            exit 0
          fi
          age=$(( $(date +%s) - $(git log -1 --format=%ct "v$VERSION") ))
          if [ "$age" -lt 7200 ]; then
            echo "v$VERSION was tagged recently, publish.yml may still be running"
            exit 0
          fi
          echo "::error title=v$VERSION is not on npm::v$VERSION is tagged but not published. Find the publish.yml run for the tag, fix the cause and re-run it."
          exit 1

      - name: Install dependencies
        if: steps.rebase.outputs.needed == 'true' || inputs.dry_run
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Test
        if: steps.rebase.outputs.needed == 'true' || inputs.dry_run
        run: npm test

      - name: Build
        if: steps.rebase.outputs.needed == 'true' || inputs.dry_run
        run: npm run build

      - name: Push the branch and tag
        if: steps.rebase.outputs.needed == 'true' || inputs.dry_run
        env:
          OLD_SHA: ${{ steps.rebase.outputs.old_sha }}
          VERSION: ${{ steps.rebase.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # in a dry run with nothing to release the tag already exists
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || git tag "v$VERSION"
          # --dry-run still authenticates against origin, so a dry run checks
          # the deploy key too
          [ "$DRY_RUN" = true ] && dry=--dry-run || dry=
          git push $dry --atomic \
            --force-with-lease="refs/heads/sveltekit:$OLD_SHA" \
            origin sveltekit:refs/heads/sveltekit "refs/tags/v$VERSION"

      - name: Explain the failure
        if: failure() && !inputs.dry_run
        run: |
          echo "::error title=Upstream sync failed::Nothing was pushed. If the rebase step failed it's a conflict between upstream and the fork patches: run bash scripts/rebase-upstream.sh locally, resolve, git rebase --continue, re-run the script, npm test, then git push origin sveltekit --force-with-lease. The next scheduled run tags and publishes."
